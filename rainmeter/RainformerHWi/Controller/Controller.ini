[Rainmeter]
Update=10000
AccurateText=1
DynamicWindowSize=1
MiddleMouseDownAction=[!UpdateMeasure MeasureRefresh]
MouseOverAction=[!ShowMeterGroup Controls][!UpdateMeterGroup Controls][!Redraw]
MouseLeaveAction=[!HideMeterGroup Controls][!UpdateMeterGroup Controls][!Redraw]
ContextTitle=Refresh controller now
ContextAction=[!UpdateMeasure MeasureRefresh]
Group=#RootConfig# | CONTROLLER

[Metadata]
Name=Rainformer Vader 5 Pro
Author=Vader Battery Tray
Information=Displays Flydigi Vader 5 Pro battery and connection state
License=MIT
Version=0.2

[Variables]
@IncludeVariables=#@#Variables.inc
@IncludeStyles=#@#Styles.inc
ApiUrl=http://127.0.0.1:42115/api/v1/state
RefreshUrl=http://127.0.0.1:42115/api/v1/command/refresh
BridgeOnline=0

[MeterBackground]
Meter=Shape
MeterStyle=StyleBackground

[MeasureNow]
Measure=Time
Format=%H%M%S

[MeasureApi]
Measure=WebParser
URL=#ApiUrl#
RegExp=(?s)^(.*)$
StringIndex=1
UpdateRate=5
DynamicVariables=1
FinishAction=[!SetVariable BridgeOnline 1][!UpdateMeasure MeasureController][!UpdateMeterGroup ControllerMeters][!Redraw]
OnConnectErrorAction=[!SetVariable BridgeOnline 0][!UpdateMeasure MeasureController][!UpdateMeterGroup ControllerMeters][!Redraw]
OnRegExpErrorAction=[!SetVariable BridgeOnline 0][!UpdateMeasure MeasureController][!UpdateMeterGroup ControllerMeters][!Redraw]

[MeasureRefresh]
Measure=WebParser
URL=#RefreshUrl#?nonce=[MeasureNow]
RegExp=(?s)^(.*)$
StringIndex=1
UpdateDivider=-1
DynamicVariables=1
FinishAction=[!Delay 750][!UpdateMeasure MeasureApi][!UpdateMeasure MeasureController][!UpdateMeterGroup ControllerMeters][!Redraw]

[MeasureController]
Measure=Script
ScriptFile=#CURRENTPATH#Controller.lua
MinValue=0
MaxValue=100
DynamicVariables=1

[MeterTitle]
Meter=String
MeterStyle=styleTitle
Text=Vader 5 Pro
UpdateDivider=-1

[ControlRefresh_]
Meter=String
MeterStyle=styleButton | StyleRightAlign
FontFace=Material icons
FontSize=11
FontColor=#colorInactiveButton#,#colorInactiveButtonAlpha#
Text=refresh
X=(#RightAlign#-1)
Y=(2 + #BgOffset#)
Hidden=1
Group=Controls
UpdateDivider=-1

[MeterStatus]
Meter=String
MeterStyle=styleFirstLineText | StyleLeftAlign
Text=BRIDGE OFFLINE
Y=#TopMarginFormula#
Group=ControllerMeters
DynamicVariables=1

[MeterBattery]
Meter=String
MeterStyle=styleFirstLineText | StyleRightAlign
Text=--
Y=#TopMarginFormula#
Group=ControllerMeters
DynamicVariables=1

[MeterBatteryBar]
Meter=Bar
MeasureName=MeasureController
MeterStyle=StyleBar
Y=(#TopMarginFormula#+15)
BarColor=#colorInactiveButton#,#colorInactiveButtonAlpha#
Group=ControllerMeters
DynamicVariables=1

[MeterConnection]
Meter=String
MeterStyle=styleSecondaryText | StyleLeftAlign
Text=Controller
Y=(#TopMarginFormula#+22)
H=12
Group=ControllerMeters
DynamicVariables=1

[MeterPower]
Meter=String
MeterStyle=styleSecondaryText | StyleRightAlign
Text=
Y=(#TopMarginFormula#+22)
H=12
Group=ControllerMeters
DynamicVariables=1

[MeterBackgroundHeight]
Meter=Image
SolidColor=255,255,255,0
X=0
Y=(#BottomMargin# + #BgOffset# + 2)R
W=(#BgWidth# * #Scale#)
H=1
TransformationMatrix=#Scale#;0;0;#Scale#;#Scale#;#Scale#
Group=Background
UpdateDivider=-1

[ControlRefresh]
Meter=Image
MeterStyle=StyleMouseRegion | StyleMouseRegionStringButtonHover
Hidden=1
Group=Controls
LeftMouseUpAction=[!UpdateMeasure MeasureRefresh]
ToolTipText=Refresh controller now
UpdateDivider=-1
