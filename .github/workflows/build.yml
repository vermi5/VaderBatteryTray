name: Windows build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build tray application
        shell: cmd
        run: VaderBatteryTray\build.cmd

      - name: Build protocol self-test
        shell: cmd
        run: VaderBatteryTray\build_led_protocol_test.cmd

      - name: Run protocol self-test
        shell: cmd
        run: VaderBatteryTray\VaderLedProtocolSelfTest.exe

      - name: Package distributable ZIP
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\package.ps1

      - name: Upload distributable package
        uses: actions/upload-artifact@v4
        with:
          name: VaderBatteryTray-windows-x64-package
          path: release/*
          if-no-files-found: error
