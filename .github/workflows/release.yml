name: Publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Build tray application
        shell: cmd
        run: VaderBatteryTray\build.cmd

      - name: Build and run protocol self-test
        shell: cmd
        run: |
          VaderBatteryTray\build_led_protocol_test.cmd
          VaderBatteryTray\VaderLedProtocolSelfTest.exe

      - name: Package release
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          powershell -NoProfile -ExecutionPolicy Bypass -File .\package.ps1 -Version $version

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $zip = "release/VaderBatteryTray-$version.zip"
          $checksum = Get-Content -LiteralPath ($zip + '.sha256') -Raw
          @(
            '## Verification',
            '',
            "- Built on GitHub Actions from tag $($env:GITHUB_REF_NAME).",
            '- `VaderLedProtocolSelfTest.exe` passed.',
            "- SHA-256: $checksum"
          ) | Set-Content -LiteralPath release-notes.md
          gh release create $env:GITHUB_REF_NAME $zip ($zip + '.sha256') --title "Vader Battery Tray $version" --notes-file release-notes.md
