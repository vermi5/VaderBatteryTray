name: Feature request
description: Suggest an improvement
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behavior
    validations:
      required: true
  - type: dropdown
    id: hardware
    attributes:
      label: Does this change controller or Dock HID behavior?
      options:
        - "No"
        - "Yes"
        - Not sure
    validations:
      required: true
